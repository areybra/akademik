<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tes HTML</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }
    header {
      background: #333;
      color: #fff;
      padding: 10px 0;
      text-align: center;
    }
    nav {
      margin: 20px 0;
    }
    nav a {
      margin-right: 15px;
      text-decoration: none;
      color: #333;
    }
    main {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
    }
    footer {
      text-align: center;
      padding: 10px;
      font-size: 0.9em;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>Selamat Datang di Website Saya</h1>
  </header>

  <nav>
    <a href="#">Beranda</a>
    <a href="#">Tentang</a>
    <a href="#">Kontak</a>
  </nav>

  <main>
    <h2>Halaman Tes</h2>
    <p>Ini adalah contoh struktur HTML sederhana.</p>

    <section>
      <h3>Formulir Kontak</h3>
      <form>
        <label for="nama">Nama:</label><br>
        <input type="text" id="nama" name="nama"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <button type="submit">Kirim</button>
      </form>
    </section>
  </main>

  <footer>
    &copy; 2026 Website Saya
  </footer>
</body>
</html>
